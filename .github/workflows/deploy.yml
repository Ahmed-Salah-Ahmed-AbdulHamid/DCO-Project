# ==========================================================================
# deploy.yml — CI/CD Pipeline for the DCO Image Processing API
# Phase 3: Continuous Integration, Delivery & Deployment
#
# Trigger:  Push to 'main' branch
# Pipeline: Test → Build & Push to ECR → Deploy to EC2
# ==========================================================================

name: "DCO — CI/CD Pipeline"

on:
  push:
    branches: [main]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Cancel any in-progress runs on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Environment variables shared across all jobs
# ---------------------------------------------------------------------------
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  CONTAINER_NAME: dco-api

# ==========================================================================
# JOB 1: Continuous Integration — Lint & Test
# ==========================================================================
jobs:
  test:
    name: "CI — Test"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      # ----- Checkout code ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----- Python setup -------------------------------------------------
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      # ----- Install dependencies -----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # ----- Run tests ----------------------------------------------------
      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short
        env:
          # Provide dummy values so the app module can be imported
          AWS_REGION: us-east-1
          S3_BUCKET_NAME: test-bucket
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

  # ==========================================================================
  # JOB 2: Build Docker Image & Push to ECR
  # ==========================================================================
  build-and-push:
    name: "CD — Build & Push to ECR"
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      # ----- Checkout code ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----- Configure AWS credentials ------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----- Login to Amazon ECR ------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ----- Build, Tag & Push --------------------------------------------
      - name: Build, tag, and push Docker image
        id: build
        working-directory: ./app
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euxo pipefail
          SAFE_REPO=$(echo "${ECR_REPOSITORY}" | tr -d '\n\r ')
          FULL_IMAGE="${ECR_REGISTRY}/${SAFE_REPO}"
          TAG="${FULL_IMAGE}:${IMAGE_TAG}"
          LATEST="${FULL_IMAGE}:latest"

          echo "==> Building image: ${TAG}"
          echo "==> Working directory: $(pwd)"
          echo "==> Dockerfile exists: $(test -f Dockerfile && echo YES || echo NO)"
          echo "==> Docker version:"
          docker version --format '{{.Client.Version}}'

          docker buildx build --load -t "${TAG}" -f Dockerfile .
          docker tag "${TAG}" "${LATEST}"

          echo "==> Pushing ${TAG}"
          docker push "${TAG}"

          echo "==> Pushing ${LATEST}"
          docker push "${LATEST}"

          echo "image_uri=${TAG}" >> "${GITHUB_OUTPUT}"

      # ----- Summary ------------------------------------------------------
      - name: Print image URI
        run: |
          echo "### 🐳 Docker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image URI** | \`${{ steps.build.outputs.image_uri }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Tag** | \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 3: Deploy to EC2
  # ==========================================================================
  deploy:
    name: "CD — Deploy to EC2"
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # ----- Deploy via EKS -----------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update KubeConfig
        run: |
          aws eks update-kubeconfig --name dco-cluster --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          set -euxo pipefail
          echo ">>> Triggering EKS Deployment Rollout..."
          
          # We use rollout restart so it pulls the latest image tag from ECR
          kubectl rollout restart deployment dco-api -n dco-app
          kubectl rollout status deployment dco-api -n dco-app
          
          echo ">>> EKS deployment updated successfully!"

      # ----- Deployment summary -------------------------------------------
      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Cluster** | \`dco-cluster\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | Rolling Restart Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
