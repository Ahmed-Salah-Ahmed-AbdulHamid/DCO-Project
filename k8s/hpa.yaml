apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dco-api-hpa
  namespace: dco-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dco-api
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
